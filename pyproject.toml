[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "open-lc-231"
version = "0.1.0"
description = "Read-only exploration tools for the Grundfos LC-231 BLE/GENI protocol"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "bleak>=1.0",
]

[tool.setuptools]
script-files = ["open-lc-231.py"]
