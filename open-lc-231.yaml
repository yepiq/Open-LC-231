text_sensor:
  - platform: ble_client
    name: Manufacturer
    ble_client_id: ble_client_id
    service_uuid: 180A
    characteristic_uuid: 2A29
    update_interval: never
    entity_category: diagnostic

  - platform: ble_client
    name: Model Number
    ble_client_id: ble_client_id
    service_uuid: 180A
    characteristic_uuid: 2A24
    update_interval: never
    entity_category: diagnostic

  - platform: ble_client
    name: Hardware Revision
    ble_client_id: ble_client_id
    service_uuid: 180A
    characteristic_uuid: 2A27
    update_interval: never
    entity_category: diagnostic

  - platform: ble_client
    name: Firmware Revision
    ble_client_id: ble_client_id
    service_uuid: 180A
    characteristic_uuid: 2A26
    update_interval: never
    entity_category: diagnostic

  - platform: ble_client
    name: Software Revision
    ble_client_id: ble_client_id
    service_uuid: 180A
    characteristic_uuid: 2A28
    update_interval: never
    entity_category: diagnostic

switch:
  - platform: template
    name: LC-231 BLE Client
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - lambda: |-
          id(ble_client_id).set_enabled(true);
      - ble_client.connect:
          id: ble_client_id
    turn_off_action:
      - lambda: |-
          id(ble_client_id).set_enabled(false);
