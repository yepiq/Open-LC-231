substitutions:
  name: open-lc-231
  friendly_name: Open LC-231
  grundfos_mac_address: !secret grundfos_mac_address
  lc231_fast_update_interval: 2s
  lc231_regular_update_interval: 30s
  lc231_slow_update_interval: 5min

esphome:
  project:
    name: yepiq.Open-LC-231
    version: 0.1.0

packages:
  - url: https://github.com/ngorchilov/esphome-lib
    ref: main
    refresh: 0s
    files:
      - path: devices/m5stack-poesp32.yaml
        vars:
          esp32_advanced:
            sram1_as_iram: true

external_components:
  - source:
      type: local
      path: components

logger:
  level: DEBUG

esp32_ble_tracker:

ble_client:
  - mac_address: ${grundfos_mac_address}
    id: ble_client_id
    on_connect:
      then:
        - lambda: |-
            id(ble_client_id).pair();

grundfos_lc231:
  id: lc231
  ble_client_id: ble_client_id
  fast_update_interval: ${lc231_fast_update_interval}
  regular_update_interval: ${lc231_regular_update_interval}
  slow_update_interval: ${lc231_slow_update_interval}

  connected:
    name: LC-231 Connected

  protocol_status:
    name: LC-231 Protocol Status

  protocol_errors:
    name: LC-231 Protocol Errors

  water_level:
    name: Water Level

  cio1_level:
    name: CIO1 Measured Level
    disabled_by_default: true

  cio1_input_current:
    name: CIO1 Input Current
    disabled_by_default: true

  above_stop_level:
